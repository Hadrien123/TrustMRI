# Paths for run_imputation.py. Relative paths are resolved against this file's folder.

# BraTS-style split: <data_dir>/<class folder>/<subject>/<subject>-{t1c,t1n,t2f,t2w}.nii[.gz]
#data_dir: "/home/dell/software/TRUSTMRI/data/brats2023_validation"

# Per subject and modality:  <output_dir>/<class folder>/<subject>/<modality>/
#   original/<subject>-<modality>.nii[.gz]          symlink to the real image
#   imputed/<subject>-<modality>-runNN<output_ext>  one per run
#output_dir: "../results/brats2023_finetuned_test"
#output_ext: ".nii"            # ".nii" matches the original dataset; ".nii.gz" to compress

#model:
#  brasyn_repo: "/home/dell/software/BraSyn_tutorial"                                   # cloned BraSyn code
#  weights_dir: "/home/dell/software/BraSyn_tutorial/mlcube/workspace/additional_files/weights/your_weight_name"  # folder holding latest_net_G.pth
#  parameters_file: "/home/dell/software/BraSyn_tutorial/mlcube/workspace/parameters.yaml"

#modalities: [t1c, t1n, t2f, t2w]   # each is dropped once and imputed from the other three
#n_runs: 10                        # imputations per subject and modality (--n-runs overrides)
#noise: 0.1                       # input noise std as a fraction of each input's brain std; 0 = off (--noise)
#dropout: 0                     # MC dropout probability inside SIT; 0 = off (--dropout). Imputations degrade fast: corr with clean output ~0.95 at 0.02, ~0.74 at 0.1
#limit: 5                       # set to N to only process the first N subjects (quick test)
#work_dir: "../results/_work_brats2023_finetuned"


data_dir: "/home/dell/software/TRUSTMRI/data/brats2023_validation_preprocessed"

output_dir: "../results/brats2023_finetuned_test_preproc"
output_ext: ".nii"

model:
  brasyn_repo: "/home/dell/software/BraSyn_tutorial"
  weights_dir: "/home/dell/software/BraSyn_tutorial/project/checkpoints/brats_africa_ft"
  parameters_file: "/home/dell/software/BraSyn_tutorial/mlcube/workspace/parameters.yaml"

